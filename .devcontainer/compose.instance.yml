# lib-crud-rs's instance-owned additions to template-rust-crate's compose.yml
# (whose dev service is `myapp`): the Postgres and MQTT broker its integration
# tests run against. Credentials are local-dev throwaways on the compose
# network (no ports are published), so they live here as literals.
include:
  - ./stack/mqtt/compose.yml

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crud
      POSTGRES_PASSWORD: crud
      POSTGRES_DB: crud_test
    # 18+'s image keeps data in a major-version subdirectory of this mount, so
    # the volume mounts one level up (docker-library/postgres#1259).
    volumes:
      - postgres-data:/var/lib/postgresql
    # $$: a literal $ for the container's shell, which reads the variables above.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  myapp:
    # Waits for the healthchecks so postCreateCommand and prek never start
    # before the services they would talk to are ready.
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    # Read by tests/support and tests/mqtt_events.rs; their defaults match.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: crud
      POSTGRES_PASSWORD: crud
      POSTGRES_DB: crud_test
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"

volumes:
  postgres-data:
