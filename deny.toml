# cargo-deny config (https://embarkstudios.github.io/cargo-deny/). Run by the
# `cargo-deny` hook in .pre-commit-config.yaml. Instance-owned: an instance
# adds the licenses its own dependencies need.

[graph]
all-features = true

[advisories]
# RUSTSEC advisories; an accepted one is listed here with a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
# Compatible with this crate's GPL-3.0-or-later (permissive licenses, plus
# the crate's own). Anything else fails until it's reviewed and added.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
